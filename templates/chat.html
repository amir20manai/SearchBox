<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Chat — SearchBox</title>
    <style>
        /* Valeurs par défaut (page ouverte seule). Dans le tiroir, les couleurs
           sont recopiées depuis la page parente (index ou résultats) par le script. */
        :root {
            --bg: #F8EEF0; --text: #1B2547; --surface: #FFFFFF; --surface-alt: #F1DDE2;
            --border: #DCC3CB; --input-border: #BCA0BB; --muted: #5B5F82;
            --brand: #1F4C96; --on-brand: #FFFFFF;
            --danger: #A23B5B; --danger-bg: #F6DDE4; --focus: rgba(88, 99, 162, 0.45);
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #121A33; --text: #F1DDE2; --surface: #1A2447; --surface-alt: #1A2447;
                --border: #2E3A66; --input-border: #5863A2; --muted: #BCA0BB;
                --brand: #5863A2; --danger: #EBA3B8; --danger-bg: #3A2A4A;
                --focus: rgba(188, 160, 187, 0.5);
            }
        }

        * { box-sizing: border-box; }
        html, body { height: 100%; }

        body {
            margin: 0; display: flex; flex-direction: column;
            height: 100vh; height: 100dvh;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
            font-size: 16px; line-height: 1.55;
            color: var(--text); background: var(--bg);
        }
        :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

        /* En-tête affiché seulement si la page est ouverte hors du tiroir */
        .standalone {
            padding: 16px 20px; border-bottom: 2px solid var(--text); background: var(--surface);
            font-size: 20px; font-weight: 800; letter-spacing: -0.02em;
        }
        .standalone a { color: var(--text); text-decoration: none; }

        /* Messages */
        .chat-messages {
            flex: 1; min-height: 0; overflow-y: auto; padding: 20px;
            display: flex; flex-direction: column; gap: 12px;
        }
        .msg {
            max-width: 88%; padding: 10px 14px; border-radius: 6px;
            font-size: 15px; overflow-wrap: anywhere;
        }
        .msg .text { white-space: pre-wrap; }
        .msg.user { align-self: flex-end; background: var(--brand); color: var(--on-brand); }
        .msg.bot { align-self: flex-start; background: var(--surface); border: 1px solid var(--border); }
        .msg.loading { color: var(--muted); font-style: italic; }
        .msg.error { border-left: 4px solid var(--danger); color: var(--danger); }

        .sources {
            margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border);
            font-size: 13px; color: var(--muted);
        }
        .sources strong { color: var(--text); font-weight: 600; }

        /* Saisie */
        .chat-input-area {
            padding: 12px 20px max(14px, env(safe-area-inset-bottom));
            border-top: 1px solid var(--border); background: var(--surface);
        }
        .field-label { display: block; margin-bottom: 4px; font-size: 14px; color: var(--muted); }
        select {
            width: 100%; margin-bottom: 10px; font: inherit; font-size: 15px; padding: 8px 10px;
            color: var(--text); background: var(--bg); border: 1px solid var(--input-border);
            border-radius: 6px; cursor: pointer;
        }
        .input-row { display: flex; }
        .input-row input {
            flex: 1; min-width: 0; font: inherit; padding: 11px 14px; color: var(--text);
            background: var(--bg); border: 1px solid var(--input-border); border-right: none;
            border-radius: 6px 0 0 6px;
        }
        .input-row input::placeholder { color: var(--muted); opacity: 0.8; }
        .input-row input:focus, select:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--focus); }
        .input-row button {
            font: inherit; font-weight: 600; padding: 0 20px; cursor: pointer;
            color: var(--on-brand); background: var(--brand); border: 1px solid var(--brand);
            border-radius: 0 6px 6px 0;
        }
        .input-row button:hover { filter: brightness(0.92); }
        .input-row button:disabled { opacity: 0.5; cursor: not-allowed; }

        @media (max-width: 768px) { input, select { font-size: 16px; } }  /* évite le zoom auto sur iPhone */
        @media (max-width: 480px) {
            .chat-messages { padding: 16px; }
            .chat-input-area { padding-left: 16px; padding-right: 16px; }
            .msg { max-width: 94%; }
        }
        @media (pointer: coarse) { button, select, input { min-height: 44px; } }
        @media (max-height: 500px) and (orientation: landscape) {
            .field-label, select { display: none; }
        }
    </style>
</head>
<body>

    <header class="standalone" id="standaloneHead" hidden><a href="/">SearchBox</a></header>

    <div class="chat-messages" id="chatMessages" role="log" aria-live="polite">
        <div class="msg bot"><div class="text">Bonjour, posez-moi une question sur vos documents.</div></div>
    </div>

    <form class="chat-input-area" id="chatForm" autocomplete="off">
        <label class="field-label" for="docSelect">Document</label>
        <select id="docSelect">
            <option value="">Tous les documents</option>
            {% for doc in documents %}
                <option value="{{ doc }}">{{ doc }}</option>
            {% endfor %}
        </select>
        <div class="input-row">
            <input type="text" id="questionInput" placeholder="Posez une question" aria-label="Votre question" enterkeyhint="send">
            <button type="submit" id="sendBtn">Envoyer</button>
        </div>
    </form>

<script>
    const chatMessages  = document.getElementById('chatMessages');
    const chatForm      = document.getElementById('chatForm');
    const questionInput = document.getElementById('questionInput');
    const sendBtn       = document.getElementById('sendBtn');
    const docSelect     = document.getElementById('docSelect');
    const embedded      = window.parent !== window;

    // Reprend les couleurs de la page parente (index ou résultats), clair ou sombre
    const SAME = ['--bg', '--text', '--surface', '--border', '--input-border', '--muted', '--danger', '--danger-bg', '--focus'];
    function syncTheme() {
        if (!embedded) return;
        try {
            const cs = getComputedStyle(window.parent.document.body);
            const get = n => cs.getPropertyValue(n).trim();
            const root = document.documentElement.style;
            SAME.forEach(n => { const v = get(n); if (v) root.setProperty(n, v); });
            const brand = get('--primary') || get('--brand');
            if (brand) root.setProperty('--brand', brand);
            root.setProperty('--on-brand', get('--on-brand') || '#FFFFFF');
            const alt = get('--panel') || get('--surface-alt');
            if (alt) root.setProperty('--surface-alt', alt);
        } catch (e) {}
    }
    syncTheme();
    window.addEventListener('message', e => {
        if (e.origin === location.origin && e.data && e.data.type === 'theme') syncTheme();
    });
    try {
        new MutationObserver(syncTheme).observe(window.parent.document.body,
            { attributes: true, attributeFilter: ['class'] });
    } catch (e) {}

    if (!embedded) document.getElementById('standaloneHead').hidden = false;

    // Échap ferme le tiroir même quand le focus est dans le chat
    document.addEventListener('keydown', e => {
        if (e.key !== 'Escape' || !embedded) return;
        try { window.parent.document.getElementById('chatClose').click(); } catch (err) {}
    });

    if (!window.matchMedia('(pointer: coarse)').matches) questionInput.focus();

    function addMessage(text, kind, sources) {
        const div = document.createElement('div');
        div.className = 'msg ' + kind;
        const body = document.createElement('div');
        body.className = 'text';
        body.textContent = text;
        div.appendChild(body);
        if (sources && sources.length) {
            const src = document.createElement('div');
            src.className = 'sources';
            const label = document.createElement('strong');
            label.textContent = 'Sources : ';
            src.appendChild(label);
            src.appendChild(document.createTextNode(sources.join(', ')));
            div.appendChild(src);
        }
        chatMessages.appendChild(div);
        chatMessages.scrollTop = chatMessages.scrollHeight;
        return div;
    }

    async function sendMessage() {
        const question = questionInput.value.trim();
        if (!question || sendBtn.disabled) return;

        addMessage(question, 'user');
        questionInput.value = '';
        sendBtn.disabled = true;
        const loadingMsg = addMessage('Réflexion en cours...', 'bot loading');

        try {
            const response = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ question: question, filename: docSelect.value })
            });
            const data = await response.json();
            loadingMsg.remove();
            if (data.error) addMessage('Erreur : ' + data.error, 'bot error');
            else addMessage(data.answer, 'bot', data.sources);
        } catch (error) {
            loadingMsg.remove();
            addMessage('Erreur réseau.', 'bot error');
        } finally {
            sendBtn.disabled = false;
            if (!window.matchMedia('(pointer: coarse)').matches) questionInput.focus();
        }
    }

    chatForm.addEventListener('submit', e => { e.preventDefault(); sendMessage(); });
</script>
</body>
</html>
